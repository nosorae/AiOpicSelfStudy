name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR 은 새 커밋이 오면 이전 실행을 취소한다. main 은 커밋마다 결과를 남기려고 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    name: 민감 정보 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 추가된 줄 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          python3 scripts/check-secrets.py "$range"

  linux:
    name: 공통, Android, 스크린샷
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gradle/gradle-daemon-jvm.properties 의 데몬 JVM(Azul 21) 과 맞춘다.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: check (spotless, 테스트, 층 의존, Roborazzi verify)
        run: ./gradlew check --continue
      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 시뮬레이터 프레임워크 링크와 iOS 테스트
        run: ./gradlew :apps:opic:shared:linkDebugFrameworkIosSimulatorArm64 iosSimulatorArm64Test --continue
      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
