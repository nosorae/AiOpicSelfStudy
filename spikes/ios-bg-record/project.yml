name: BgRecord
options:
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
targets:
  BgRecord:
    type: application
    platform: iOS
    sources: [BgRecord]
    configFiles:
      Debug: Config.xcconfig
    info:
      path: BgRecord/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 화면이 꺼진 채 녹음이 이어지는지 확인하려고 마이크를 쓴다.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nosorae.aiopic.spike.bgrecord
        DEVELOPMENT_TEAM: $(TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
